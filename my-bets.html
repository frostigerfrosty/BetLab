<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BetLab - My Bets</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/my-bets.js" defer></script>
</head>

<body>

    <div class="app">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="logo">
                <span class="logo-mark">B</span>
                <span>BETLAB</span>
            </div>

            <nav class="navigation">

                <p class="nav-title">MENU</p>

                <a href="index.html" class="nav-item">
                    <span>▦</span>
                    Dashboard
                </a>

                <a href="my-bets.html" class="nav-item active">
                    <span>↗</span>
                    My Bets
                </a>

                <a href="analytics.html" class="nav-item">
                    <span>◒</span>
                    Analytics
                </a>

                <a href="#" class="nav-item">
                    <span>⌁</span>
                    Calculator
                </a>

                <p class="nav-title second-title">GENERAL</p>

                <a href="#" class="nav-item">
                    <span>⚙</span>
                    Settings
                </a>

            </nav>

        </aside>


        <!-- MAIN CONTENT -->
        <main class="main">

            <header class="topbar">

                <div>
                    <h1>My Bets</h1>
                    <p>Manage and review your bets</p>
                </div>

                <button class="add-button" id="add-bet-button">
                    + Add Bet
                </button>

            </header>


            <section class="card bets-card my-bets-card">

                <div class="card-header">

        <div>
            <h2>All Bets</h2>
            <p>Your complete betting history</p>
        </div>

        <select id="bet-sort">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="profit-high">Highest profit</option>
            <option value="profit-low">Lowest profit</option>
        </select>

    </div>


                <div class="table">

                    <div class="table-row table-head">
                        <span>DATE</span>
                        <span>EVENT</span>
                        <span>BET</span>
                        <span>ODDS</span>
                        <span>STAKE</span>
                        <span>RESULT</span>
                        <span>PROFIT</span>
                        <span>ACTIONS</span>
                    </div>

                    <div class="table-body" id="bets-table"></div>

                </div>

            </section>

        </main>

    </div>
        <!-- EDIT BET MODAL -->
<div class="modal-overlay" id="edit-bet-modal">

    <div class="modal">

        <div class="modal-header">
            <div>
                <h2>Edit Bet</h2>
                <p>Update your recorded bet</p>
            </div>

            <button class="modal-close" id="close-edit-modal">
                ×
            </button>
        </div>


        <form id="edit-bet-form">

            <div class="form-group">
                <label for="edit-team1">Team 1</label>
                <input
                    type="text"
                    id="edit-team1"
                    required
                >
            </div>


            <div class="form-group">
                <label for="edit-team2">Team 2</label>
                <input
                    type="text"
                    id="edit-team2"
                    required
                >
            </div>


            <div class="form-group">
                <label for="edit-bet-type">Bet Type</label>

                <select id="edit-bet-type" required>
                    <option value="">Select bet type</option>
                    <option value="Match Winner">Match Winner</option>
                    <option value="Over 2.5">Over 2.5</option>
                    <option value="Under 2.5">Under 2.5</option>
                    <option value="BTTS">BTTS</option>
                    <option value="Other">Other</option>
                </select>
            </div>


            <div class="form-row">

                <div class="form-group">
                    <label for="edit-odds">Odds</label>

                    <input
                        type="number"
                        id="edit-odds"
                        step="0.01"
                        min="1"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="edit-stake">Stake (CHF)</label>

                    <input
                        type="number"
                        id="edit-stake"
                        step="0.01"
                        min="0.01"
                        required
                    >
                </div>

            </div>


            <div class="form-group">
                <label for="edit-bet-date">Date</label>

                <input
                    type="date"
                    id="edit-bet-date"
                    required
                >
            </div>


            <div class="form-group">
                <label for="edit-result">Result</label>

                <select id="edit-result" required>
                    <option value="pending">Pending</option>
                    <option value="win">Win</option>
                    <option value="loss">Loss</option>
                </select>
            </div>


            <div class="modal-actions">

                <button
                    type="button"
                    class="cancel-button"
                    id="cancel-edit-modal"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="save-button"
                >
                    Save Changes
                </button>

            </div>

        </form>

    </div>

</div>
    <!-- ADD BET MODAL -->
<div class="modal-overlay" id="add-bet-modal">

    <div class="modal">

        <div class="modal-header">

            <div>
                <h2>Add New Bet</h2>
                <p>Record a new bet</p>
            </div>

            <button class="modal-close" id="close-modal">
                ×
            </button>

        </div>


        <form id="add-bet-form">

            <div class="form-group">

                <label for="team1">Team 1</label>

                <input
                    type="text"
                    id="team1"
                    placeholder="e.g. Arsenal"
                    required
                >

            </div>


            <div class="form-group">

                <label for="team2">Team 2</label>

                <input
                    type="text"
                    id="team2"
                    placeholder="e.g. Chelsea"
                    required
                >

            </div>


            <div class="form-group">

                <label for="bet-type">Bet Type</label>

                <select id="bet-type" required>

                    <option value="">Select bet type</option>
                    <option value="Match Winner">Match Winner</option>
                    <option value="Over 2.5">Over 2.5</option>
                    <option value="Under 2.5">Under 2.5</option>
                    <option value="BTTS">BTTS</option>
                    <option value="Other">Other</option>

                </select>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="odds">Odds</label>

                    <input
                        type="number"
                        id="odds"
                        step="0.01"
                        min="1"
                        placeholder="1.72"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="stake">Stake (CHF)</label>

                    <input
                        type="number"
                        id="stake"
                        step="0.01"
                        min="0.01"
                        placeholder="20.00"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="bet-date">Date</label>

                <input
                    type="date"
                    id="bet-date"
                    required
                >

            </div>


            <div class="form-group">

                <label for="result">Result</label>

                <select id="result" required>

                    <option value="pending">Pending</option>
                    <option value="win">Win</option>
                    <option value="loss">Loss</option>

                </select>

            </div>


            <div class="modal-actions">

                <button
                    type="button"
                    class="cancel-button"
                    id="cancel-modal"
                >
                    Cancel
                </button>


                <button
                    type="submit"
                    class="save-button"
                >
                    Save Bet
                </button>

            </div>

        </form>

    </div>

</div>
</body>
</html>
